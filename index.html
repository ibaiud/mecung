<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mê Cung Cổ Điển + Skin Mới</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --primary: #4caf50;
      --secondary: #ff9800;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--panel-bg);
      border-radius: 8px;
      border: 1px solid #333;
    }

    .title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--primary);
    }

    .stats-bar {
      display: flex;
      gap: 10px;
      font-size: 0.9rem;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--primary);
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(18, 18, 18, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }

    .screen.hidden {
      display: none;
    }

    .screen h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .screen h2 {
      font-size: 1.3rem;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .screen p {
      color: #b0b0b0;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .btn {
      background: var(--primary);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 22px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-secondary {
      background: #424242;
      color: #fff;
    }

    /* Khung chọn skin phong cách cũ gọn gàng */
    .skin-selector-box {
      margin: 10px 0;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      max-width: 320px;
    }

    .skin-title {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .skin-grid {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .skin-item {
      padding: 6px 10px;
      background: #2c2c2c;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .skin-item.selected {
      border-color: var(--primary);
      background: rgba(76, 175, 80, 0.2);
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 15px;
    }

    .level-btn {
      background: #2c2c2c;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 0;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .level-btn.unlocked {
      background: var(--panel-bg);
      border-color: var(--primary);
      color: var(--primary);
    }

    .level-btn.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 5px;
      margin-top: 8px;
    }

    .dbtn {
      background: var(--panel-bg);
      border: 1px solid #444;
      color: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .dbtn:active {
      background: var(--primary);
      color: #000;
    }

    .dbtn-up { grid-column: 2; grid-row: 1; }
    .dbtn-left { grid-column: 1; grid-row: 2; }
    .dbtn-down { grid-column: 2; grid-row: 3; }
    .dbtn-right { grid-column: 3; grid-row: 2; }

    @media (min-width: 768px) {
      .touch-controls { display: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title">🟩 Mê Cung Cổ Điển</div>
      <div class="stats-bar">
        <div>Màn: <span id="current-level-display" style="color:var(--secondary)">1</span></div>
        <div>💎 <span id="gems-display" style="color:var(--secondary)">0</span></div>
      </div>
      <button id="btn-home" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;">Menu</button>
    </header>

    <div id="game-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <!-- Màn hình chính (Giao diện cũ + Chọn skin) -->
      <div id="start-screen" class="screen">
        <h1>MÊ CUNG CỔ ĐIỂN</h1>
        <p>Tìm đường thoát khỏi mê cung quen thuộc!</p>

        <div class="skin-selector-box">
          <div class="skin-title">Chọn Skin Nhân Vật</div>
          <div class="skin-grid" id="skin-options">
            <div class="skin-item selected" data-skin="🟢">🟢</div>
            <div class="skin-item" data-skin="🔴">🔴</div>
            <div class="skin-item" data-skin="⭐">⭐</div>
            <div class="skin-item" data-skin="🐱">🐱</div>
            <div class="skin-item" data-skin="🤖">🤖</div>
          </div>
        </div>

        <button id="btn-start" class="btn">CHƠI NGAY</button>
      </div>

      <!-- Màn hình chọn màn -->
      <div id="level-screen" class="screen hidden">
        <h2>CHỌN MÀN CHƠI</h2>
        <div class="level-grid" id="level-grid"></div>
        <button id="btn-back-start" class="btn btn-secondary">Quay lại</button>
      </div>

      <!-- Màn hình chiến thắng -->
      <div id="win-screen" class="screen hidden">
        <h2 style="color: var(--primary);">HOÀN THÀNH!</h2>
        <p>Bạn đã qua màn thành công.<br>Nhận +3 💎</p>
        <div>
          <button id="btn-next-level" class="btn">Màn tiếp theo</button>
          <button id="btn-retry" class="btn btn-secondary">Chơi lại</button>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <button id="btn-hint" class="btn btn-secondary" style="font-size: 0.8rem; padding: 6px 12px;">💡 Gợi ý đường đi (3 💎)</button>
    </div>

    <div class="touch-controls">
      <div class="dbtn dbtn-up" id="ctrl-up">▲</div>
      <div class="dbtn dbtn-left" id="ctrl-left">◄</div>
      <div class="dbtn dbtn-down" id="ctrl-down">▼</div>
      <div class="dbtn dbtn-right" id="ctrl-right">►</div>
    </div>
  </div>

  <script>
    const LEVELS = [
      { id: 1, cols: 9, rows: 9, gems: 1 },
      { id: 2, cols: 11, rows: 11, gems: 2 },
      { id: 3, cols: 13, rows: 13, gems: 2 },
      { id: 4, cols: 15, rows: 15, gems: 3 },
      { id: 5, cols: 17, rows: 17, gems: 3 },
      { id: 6, cols: 19, rows: 19, gems: 4 },
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentLevelIdx = 0;
    let unlockedLevel = parseInt(localStorage.getItem('classic_maze_unlocked') || '1');
    let totalGems = parseInt(localStorage.getItem('classic_maze_gems') || '0');
    let selectedSkin = '🟢';

    let grid = [], cols, rows, cellSize;
    let player = { x: 0, y: 0 };
    let endGoal = { x: 0, y: 0 };
    let gems = [];
    let hintPath = [];

    const startScreen = document.getElementById('start-screen');
    const levelScreen = document.getElementById('level-screen');
    const winScreen = document.getElementById('win-screen');
    const levelGridEl = document.getElementById('level-grid');
    const levelDisplay = document.getElementById('current-level-display');
    const gemsDisplay = document.getElementById('gems-display');

    function updateUI() {
      levelDisplay.innerText = currentLevelIdx + 1;
      gemsDisplay.innerText = totalGems;
      localStorage.setItem('classic_maze_gems', totalGems.toString());
      localStorage.setItem('classic_maze_unlocked', unlockedLevel.toString());
    }

    class Cell {
      constructor(c, r) {
        this.c = c;
        this.r = r;
        this.walls = [true, true, true, true];
        this.visited = false;
      }
      checkNeighbors() {
        const neighbors = [];
        const { c, r } = this;
        const top = grid[index(c, r - 1)];
        const right = grid[index(c + 1, r)];
        const bottom = grid[index(c, r + 1)];
        const left = grid[index(c - 1, r)];
        if (top && !top.visited) neighbors.push(top);
        if (right && !right.visited) neighbors.push(right);
        if (bottom && !bottom.visited) neighbors.push(bottom);
        if (left && !left.visited) neighbors.push(left);
        if (neighbors.length > 0) {
          return neighbors[Math.floor(Math.random() * neighbors.length)];
        }
        return undefined;
      }
    }

    function index(c, r) {
      if (c < 0 || r < 0 || c >= cols || r >= rows) return -1;
      return c + r * cols;
    }

    function removeWalls(a, b) {
      const x = a.c - b.c;
      if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
      else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }
      const y = a.r - b.r;
      if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
      else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
    }

    function generateMaze() {
      const level = LEVELS[currentLevelIdx];
      cols = level.cols;
      rows = level.rows;
      cellSize = Math.floor(canvas.width / cols);

      grid = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          grid.push(new Cell(c, r));
        }
      }

      let current = grid[0];
      current.visited = true;
      const stack = [];

      while (true) {
        const next = current.checkNeighbors();
        if (next) {
          next.visited = true;
          stack.push(current);
          removeWalls(current, next);
          current = next;
        } else if (stack.length > 0) {
          current = stack.pop();
        } else {
          break;
        }
      }

      player.x = 0; player.y = 0;
      endGoal.x = cols - 1; endGoal.y = rows - 1;
      hintPath = [];

      gems = [];
      while (gems.length < level.gems) {
        let rx = Math.floor(Math.random() * cols);
        let ry = Math.floor(Math.random() * rows);
        if ((rx !== 0 || ry !== 0) && (rx !== endGoal.x || ry !== endGoal.y)) {
          if (!gems.some(g => g.x === rx && g.y === ry)) {
            gems.push({ x: rx, y: ry, collected: false });
          }
        }
      }
    }

    function findPathBFS() {
      const startKey = `${player.x},${player.y}`;
      const queue = [[{ x: player.x, y: player.y }]];
      const visited = new Set([startKey]);

      while (queue.length > 0) {
        const path = queue.shift();
        const curr = path[path.length - 1];
        if (curr.x === endGoal.x && curr.y === endGoal.y) return path;

        const cell = grid[index(curr.x, curr.y)];
        const neighbors = [];
        if (!cell.walls[0]) neighbors.push({ x: curr.x, y: curr.y - 1 });
        if (!cell.walls[1]) neighbors.push({ x: curr.x + 1, y: curr.y });
        if (!cell.walls[2]) neighbors.push({ x: curr.x, y: curr.y + 1 });
        if (!cell.walls[3]) neighbors.push({ x: curr.x - 1, y: curr.y });

        for (let n of neighbors) {
          const key = `${n.x},${n.y}`;
          if (!visited.has(key)) {
            visited.add(key);
            queue.push([...path, n]);
          }
        }
      }
      return [];
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#4caf50';
      ctx.lineWidth = 2;

      for (let i = 0; i < grid.length; i++) {
        const cell = grid[i];
        const x = cell.c * cellSize;
        const y = cell.r * cellSize;

        if (cell.walls[0]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cellSize, y); ctx.stroke(); }
        if (cell.walls[1]) { ctx.beginPath(); ctx.moveTo(x + cellSize, y); ctx.lineTo(x + cellSize, y + cellSize); ctx.stroke(); }
        if (cell.walls[2]) { ctx.beginPath(); ctx.moveTo(x + cellSize, y + cellSize); ctx.lineTo(x, y + cellSize); ctx.stroke(); }
        if (cell.walls[3]) { ctx.beginPath(); ctx.moveTo(x, y + cellSize); ctx.lineTo(x, y); ctx.stroke(); }
      }

      if (hintPath.length > 0) {
        ctx.strokeStyle = '#ff9800';
        ctx.lineWidth = 3;
        ctx.beginPath();
        hintPath.forEach((pt, idx) => {
          const hx = pt.x * cellSize + cellSize / 2;
          const hy = pt.y * cellSize + cellSize / 2;
          if (idx === 0) ctx.moveTo(hx, hy);
          else ctx.lineTo(hx, hy);
        });
        ctx.stroke();
      }

      gems.forEach(gem => {
        if (!gem.collected) {
          const gx = gem.x * cellSize + cellSize / 2;
          const gy = gem.y * cellSize + cellSize / 2;
          ctx.font = `${cellSize * 0.5}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('💎', gx, gy);
        }
      });

      const gx = endGoal.x * cellSize + cellSize / 2;
      const gy = endGoal.y * cellSize + cellSize / 2;
      ctx.fillStyle = '#ff9800';
      ctx.fillRect(gx - cellSize*0.3, gy - cellSize*0.3, cellSize*0.6, cellSize*0.6);

      const px = player.x * cellSize + cellSize / 2;
      const py = player.y * cellSize + cellSize / 2;
      if (selectedSkin === '🟢' || selectedSkin === '🔴') {
        ctx.beginPath();
        ctx.arc(px, py, cellSize * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = selectedSkin === '🟢' ? '#4caf50' : '#f44336';
        ctx.fill();
      } else {
        ctx.font = `${cellSize * 0.6}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(selectedSkin, px, py);
      }
    }

    function movePlayer(dir) {
      const currentCell = grid[index(player.x, player.y)];
      let moved = false;

      if (dir === 'up' && !currentCell.walls[0]) { player.y--; moved = true; }
      else if (dir === 'right' && !currentCell.walls[1]) { player.x++; moved = true; }
      else if (dir === 'down' && !currentCell.walls[2]) { player.y++; moved = true; }
      else if (dir === 'left' && !currentCell.walls[3]) { player.x--; moved = true; }

      if (moved) {
        if (hintPath.length > 0) hintPath = [];
        gems.forEach(gem => {
          if (!gem.collected && gem.x === player.x && gem.y === player.y) {
            gem.collected = true;
            totalGems++;
            updateUI();
          }
        });

        if (player.x === endGoal.x && player.y === endGoal.y) {
          if (currentLevelIdx + 1 >= unlockedLevel && unlockedLevel < LEVELS.length) {
            unlockedLevel = currentLevelIdx + 2;
          }
          totalGems += 3;
          updateUI();
          winScreen.classList.remove('hidden');
        }
        draw();
      }
    }

    function startLevel(idx) {
      currentLevelIdx = idx;
      updateUI();
      generateMaze();
      draw();
      startScreen.classList.add('hidden');
      levelScreen.classList.add('hidden');
      winScreen.classList.add('hidden');
    }

    function renderLevelMenu() {
      levelGridEl.innerHTML = '';
      LEVELS.forEach((lvl, i) => {
        const btn = document.createElement('button');
        const isUnlocked = i + 1 <= unlockedLevel;
        btn.className = `level-btn ${isUnlocked ? 'unlocked' : 'locked'}`;
        btn.innerText = lvl.id;
        if (isUnlocked) {
          btn.addEventListener('click', () => startLevel(i));
        }
        levelGridEl.appendChild(btn);
      });
    }

    // Chọn skin
    document.querySelectorAll('.skin-item').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.skin-item').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedSkin = opt.getAttribute('data-skin');
      });
    });

    window.addEventListener('keydown', (e) => {
      if (!winScreen.classList.contains('hidden') || !startScreen.classList.contains('hidden')) return;
      switch(e.key) {
        case 'ArrowUp': case 'w': movePlayer('up'); break;
        case 'ArrowDown': case 's': movePlayer('down'); break;
        case 'ArrowLeft': case 'a': movePlayer('left'); break;
        case 'ArrowRight': case 'd': movePlayer('right'); break;
      }
    });

    document.getElementById('ctrl-up').addEventListener('click', () => movePlayer('up'));
    document.getElementById('ctrl-down').addEventListener('click', () => movePlayer('down'));
    document.getElementById('ctrl-left').addEventListener('click', () => movePlayer('left'));
    document.getElementById('ctrl-right').addEventListener('click', () => movePlayer('right'));

    document.getElementById('btn-hint').addEventListener('click', () => {
      if (totalGems >= 3) {
        totalGems -= 3;
        updateUI();
        hintPath = findPathBFS();
        draw();
      } else {
        alert('Không đủ 3 💎 kim cương!');
      }
    });

    document.getElementById('btn-start').addEventListener('click', () => {
      renderLevelMenu();
      startScreen.classList.add('hidden');
      levelScreen.classList.remove('hidden');
    });

    document.getElementById('btn-back-start').addEventListener('click', () => {
      levelScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    });

    document.getElementById('btn-home').addEventListener('click', () => {
      winScreen.classList.add('hidden');
      levelScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    });

    document.getElementById('btn-next-level').addEventListener('click', () => {
      if (currentLevelIdx + 1 < LEVELS.length) {
        startLevel(currentLevelIdx + 1);
      } else {
        renderLevelMenu();
        winScreen.classList.add('hidden');
        levelScreen.classList.remove('hidden');
      }
    });

    document.getElementById('btn-retry').addEventListener('click', () => {
      startLevel(currentLevelIdx);
    });

    updateUI();
  </script>
</body>
</html>
